[build-system]
requires = [
  "setuptools>=70.1",
]
build-backend = "setuptools.build_meta"

[project]
name = "dpdfnet-native"
version = "1.0.0"
description = "Native x86-64 CPU inference for DPDFNet 48 kHz speech enhancement (a fork of Ceva-IP/DPDFNet)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Daniel Rika" }
]
keywords = ["speech-enhancement", "audio", "cpu", "avx2", "dpdfnet"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
 
dependencies = [
  "numpy>=1.26",
  "librosa>=0.11",
  "soundfile>=0.13",
  "tqdm>=4.66",
]

[project.optional-dependencies]
test = [
  "pytest>=7.4",
]
mp3 = [
  "pydub>=0.25",
]

[project.scripts]
dpdfnet-native = "dpdfnet_native.cli:main"

[project.urls]
Homepage = "https://github.com/perennialtech/DPDFNet"
Repository = "https://github.com/perennialtech/DPDFNet"
Issues = "https://github.com/perennialtech/DPDFNet/issues"
Upstream = "https://github.com/ceva-ip/DPDFNet"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
