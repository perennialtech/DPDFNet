name: Native integration
on:
  push:
    paths: ['optimized_inference/**', '.github/workflows/native-integration.yml']
  pull_request:
    paths: ['optimized_inference/**', '.github/workflows/native-integration.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release shared (PGO)
            pgo: true
          - name: Release static
            pgo: false
            config: '-DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF'
          - name: Release AVX2 fallback
            pgo: false
            config: '-DCMAKE_BUILD_TYPE=Release -DDPDF_ENABLE_AVX_VNNI=OFF'
          - name: ASan and UBSan
            pgo: false
            config: '-DCMAKE_BUILD_TYPE=RelWithDebInfo -DDPDF_SANITIZE=ON -DBUILD_SHARED_LIBS=ON'
          - name: TSan
            pgo: false
            tsan: true
            config: '-DCMAKE_BUILD_TYPE=RelWithDebInfo -DDPDF_SANITIZE_THREAD=ON'
    name: ${{ matrix.name }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: optimized_inference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.pgo
        with:
          python-version: '3.12'
      - name: Fit ThreadSanitizer's address layout
        if: matrix.tsan
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Check generated VNNI assembly
        run: python3 tools/generate_vnni.py --check
      - name: Verify both model weights
        run: sha256sum -c models/SHA256SUMS
      - name: Build recommended PGO release and run contracts
        if: matrix.pgo
        run: python3 tools/build.py --build-dir build/ci --jobs 2
      - name: Test native Python streaming integration
        if: matrix.pgo
        run: |
          python3 -m pip install -e '../package[test]'
          DPDFNET_NATIVE_LIBRARY=build/ci/libdpdfnet.so python3 -m pytest -q ../package/tests
      - name: Configure static or sanitizer build
        if: '!matrix.pgo'
        run: cmake -S . -B build/ci ${{ matrix.config }} -DDPDF_PGO_MODE=OFF -DBUILD_TESTING=ON
      - name: Build
        if: '!matrix.pgo'
        run: cmake --build build/ci -j 2
      - name: Run contracts for both models
        if: '!matrix.pgo'
        run: ctest --test-dir build/ci --output-on-failure --parallel 1
  windows:
    name: Windows release shared (PGO)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
        working-directory: optimized_inference
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check generated VNNI assembly
        run: python3 tools/generate_vnni.py --check
      - name: Verify both model weights
        run: sha256sum -c models/SHA256SUMS
      - name: Build recommended PGO release and run contracts
        run: python3 tools/build.py --build-dir build/ci --jobs 2
      - name: Test native Python streaming integration
        shell: pwsh
        run: |
          if (-not (Test-Path build/ci/libdpdfnet.dll)) { throw 'build/ci/libdpdfnet.dll is missing' }
          python -m pip install -e '../package[test]'
          $env:DPDFNET_NATIVE_LIBRARY = "$PWD/build/ci/libdpdfnet.dll"
          python -m pytest -q ../package/tests
